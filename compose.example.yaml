# Example stack behind Traefik. Copy to compose.yaml (not tracked) and either
# fill in the values or put them into a .env file next to it (see .env.example).
#
#   docker compose up -d
#   docker exec -it worklog-mcp worklog token create <agent-name> --owner <user>
#
# No port is published: the container is only reachable through Traefik.
# Do not add a compress middleware to this router; it can buffer streamed
# MCP responses.

services:
  worklog:
    # published image (amd64/arm64); pin a version like :0.1 once released
    image: ghcr.io/axute/worklog-mcp:latest
    # to build from this checkout instead, replace the line above with:
    # build: ${WORKLOG_SRC:-.}
    # image: worklog-mcp:local
    container_name: worklog-mcp
    restart: unless-stopped
    environment:
      TZ: ${WORKLOG_TZ:-Europe/Berlin}
      WORKLOG_DB: /data/worklog.db
      # optional: sign-in for the web view through Traefik forward auth (see the routers below)
      # WORKLOG_PROXY_SECRET: ${WORKLOG_PROXY_SECRET}
      # WORKLOG_LOGOUT_URL: https://auth.example.com/logout
    volumes:
      # use a path directly on a pool/disk, not a FUSE/union mount: SQLite locks need a real file system
      - ${WORKLOG_DATA:?set WORKLOG_DATA}:/data
      # optional: a separate backup target, used with `worklog backup --dir /backups`
      # - ${WORKLOG_BACKUPS}:/backups
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK}
      traefik.http.routers.worklog.rule: Host(`${WORKLOG_HOST:?set WORKLOG_HOST}`)
      # entrypoints / TLS: only needed when Traefik has no default entrypoint with a cert resolver
      # traefik.http.routers.worklog.entrypoints: websecure
      # traefik.http.routers.worklog.tls.certresolver: letsencrypt
      traefik.http.routers.worklog.middlewares: worklog-headers
      traefik.http.services.worklog.loadbalancer.server.port: "8000"
      # optional: web view behind an existing forward-auth middleware (here "authelia@docker").
      # The main router then removes the proxy headers, the ui router sets the secret after auth.
      # traefik.http.routers.worklog.middlewares: worklog-strip,worklog-headers
      # traefik.http.routers.worklog.service: worklog
      # traefik.http.routers.worklog-ui.rule: Host(`${WORKLOG_HOST}`) && (Path(`/`) || PathPrefix(`/ui`))
      # traefik.http.routers.worklog-ui.priority: "100"
      # traefik.http.routers.worklog-ui.middlewares: authelia@docker,worklog-proxy,worklog-headers
      # traefik.http.routers.worklog-ui.service: worklog
      # traefik.http.middlewares.worklog-strip.headers.customrequestheaders.Remote-User: ""
      # traefik.http.middlewares.worklog-strip.headers.customrequestheaders.X-Worklog-Proxy: ""
      # traefik.http.middlewares.worklog-proxy.headers.customrequestheaders.X-Worklog-Proxy: ${WORKLOG_PROXY_SECRET}
      traefik.http.middlewares.worklog-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.worklog-headers.headers.contentTypeNosniff: "true"

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK}
    external: true
