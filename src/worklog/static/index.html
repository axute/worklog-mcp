<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Worklog</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<form id="login" class="login" hidden autocomplete="off">
  <h1>Worklog</h1>
  <p data-t="loginHint"></p>
  <label for="login-token" data-t="token"></label>
  <input id="login-token" type="password" name="token" required spellcheck="false" autocapitalize="off">
  <button type="submit" data-t="signIn"></button>
  <p id="login-error" class="error" role="alert"></p>
  <p class="muted small"><code>worklog token create web --scopes read</code></p>
</form>

<div id="app" hidden>
  <header class="top">
    <h1>Worklog</h1>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-entries" data-tab="entries" data-t="entries"></button>
      <button type="button" role="tab" id="tab-overview" data-tab="overview" data-t="overview"></button>
      <button type="button" role="tab" id="tab-tokens" data-tab="tokens" data-t="tokens" hidden></button>
    </nav>
    <span class="who"><span id="who" class="muted"></span>
      <button type="button" id="logout" class="link" data-t="signOut" hidden></button>
      <a id="logout-link" class="link" data-t="signOut" hidden></a></span>
  </header>

  <section id="filters" class="filters" aria-label="Filter">
    <input id="f-q" type="search" data-tp="search" spellcheck="false">
    <select id="f-project" data-ta="project"></select>
    <select id="f-agent" data-ta="agent"></select>
    <select id="f-source" data-ta="source"></select>
    <select id="f-range" data-ta="period">
      <option value="all" data-t="rangeAll"></option>
      <option value="today" data-t="rangeToday"></option>
      <option value="7d" data-t="range7"></option>
      <option value="30d" data-t="range30"></option>
      <option value="month" data-t="rangeMonth"></option>
      <option value="year" data-t="rangeYear"></option>
      <option value="custom" data-t="rangeCustom"></option>
    </select>
    <span id="f-custom" class="custom" hidden>
      <input id="f-since" type="date" data-ta="from">
      <span class="muted">–</span>
      <input id="f-until" type="date" data-ta="to">
    </span>
    <button type="button" id="f-reset" class="link" data-t="reset" hidden></button>
    <button type="button" id="f-rename" class="link" data-t="renameProject" hidden></button>
  </section>

  <div class="status-row">
    <p id="status" class="muted small" role="status"></p>
    <span id="export" class="export small" hidden>
      <span class="muted" data-t="export"></span>
      <a id="export-md" download>Markdown</a>
      <a id="export-csv" download>CSV</a>
    </span>
  </div>
  <datalist id="project-names"></datalist>

  <main id="view-entries">
    <div id="entries"></div>
    <button type="button" id="more" class="more" hidden></button>
  </main>

  <main id="view-overview" hidden>
    <div class="tiles" id="tiles"></div>

    <section class="card">
      <div class="card-head">
        <h2 data-t="perProject"></h2>
        <div class="seg" role="group" data-ta="metric">
          <button type="button" data-metric="time" data-t="time"></button>
          <button type="button" data-metric="entries" data-t="entries"></button>
        </div>
      </div>
      <div id="projects" class="bars"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2 id="timeline-title"></h2></div>
      <div id="timeline" class="timeline"></div>
      <details class="table-view">
        <summary data-t="asTable"></summary>
        <div class="table-wrap"><table id="timeline-table"></table></div>
      </details>
    </section>
  </main>

  <main id="view-tokens" hidden>
    <form id="token-form" class="card token-form" autocomplete="off">
      <h2 data-t="newToken"></h2>
      <p class="muted small" data-t="newTokenHint"></p>
      <div class="token-fields">
        <label class="field"><span data-t="tokenName"></span>
          <input id="token-name" name="name" required maxlength="64" pattern="[A-Za-z0-9._\-]{1,64}" spellcheck="false" autocapitalize="off">
        </label>
        <fieldset class="field scopes"><legend data-t="scopes"></legend>
          <label><input type="checkbox" name="scope" value="read"> <span data-t="scopeRead"></span></label>
          <label><input type="checkbox" name="scope" value="write" checked> <span data-t="scopeWrite"></span></label>
        </fieldset>
        <button type="submit" class="primary" data-t="create"></button>
      </div>
      <p id="token-error" class="error" role="alert"></p>
    </form>

    <section id="token-new" class="card token-new" hidden>
      <h2 data-t="tokenCreated"></h2>
      <p data-t="tokenOnce"></p>
      <div class="token-copy">
        <code id="token-value"></code>
        <button type="button" id="token-copy" class="primary" data-t="copy"></button>
      </div>
      <button type="button" id="token-done" class="link" data-t="done"></button>
    </section>

    <section class="card">
      <h2 data-t="tokens"></h2>
      <div class="table-wrap tokens-wrap"><table id="token-table"></table></div>
    </section>
  </main>
</div>

<div id="tip" class="tip" hidden></div>
<script src="app.js" defer></script>
</body>
</html>
