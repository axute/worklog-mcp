[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "worklog"
version = "0.1.0"
description = "MCP server that collects work log entries from AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.8",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "httpx==0.28.1",
]

[project.scripts]
worklog = "worklog.cli:main"
worklog-import = "worklog_import.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worklog = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
